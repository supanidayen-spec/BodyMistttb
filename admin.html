<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>รายการสั่งซื้อ | Body Scent Admin</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="stylesheet" href="style.css">

  <!-- สไตล์เฉพาะหน้าแอดมิน (ย้ายไปรวมใน style.css ได้ภายหลัง) -->
  <style>
    .page-title {
      font-size: var(--text-xl);
    }

    .table-wrap {
      overflow-x: auto;
      background: var(--color-white);
      border: var(--hairline-soft);
      border-radius: var(--radius);
    }

    #ordersTable {
      width: 100%;
      min-width: 820px;
      border-collapse: collapse;
      font-size: var(--text-sm);
      line-height: 1.7;
    }

    #ordersTable th,
    #ordersTable td {
      padding: var(--space-2) var(--space-3);
      text-align: left;
      vertical-align: top;
      border-bottom: var(--hairline-soft);
    }

    #ordersTable thead th {
      font-weight: 500;
      white-space: nowrap;
      color: var(--color-ink-soft);
      border-bottom: var(--hairline);
    }

    #ordersTable tbody tr:last-child td {
      border-bottom: 0;
    }

    #ordersTable tbody tr:hover {
      background: var(--color-cream);
    }

    /* วันเวลาและจำนวนเงินไม่ตัดบรรทัด ส่วนรายการ/หมายเหตุให้ตัดคำได้ */
    #ordersTable td:nth-child(1),
    #ordersTable td:nth-child(5) {
      white-space: nowrap;
    }

    #ordersTable td:nth-child(4),
    #ordersTable td:nth-child(6) {
      min-width: 180px;
    }

    .site-footer__copy {
      max-width: none;
      margin: 0;
    }

    .admin-footer {
      padding-block: var(--space-4);
    }
  </style>
</head>
<body>

  <header class="site-header">
    <div class="container site-header__inner">
      <a class="brand" href="index.html">BODY SCENT</a>
      <nav class="nav" aria-label="เมนูหลัก">
        <a href="index.html">หน้าแรก</a>
        <a href="admin.html" aria-current="page">รายการสั่งซื้อ</a>
      </nav>
    </div>
  </header>

  <main>
    <section class="section">
      <div class="container">

        <div class="section__header">
          <h1 class="page-title">รายการสั่งซื้อ</h1>
          <p class="lead">แสดงรายการล่าสุดก่อน</p>
        </div>

        <div class="table-wrap">
          <table id="ordersTable">
            <thead>
              <tr>
                <th scope="col">วันเวลา</th>
                <th scope="col">ชื่อลูกค้า</th>
                <th scope="col">เบอร์โทร/Line</th>
                <th scope="col">รายการสินค้า</th>
                <th scope="col">จำนวนเงินรวม</th>
                <th scope="col">หมายเหตุ</th>
              </tr>
            </thead>
            <tbody></tbody>
          </table>
        </div>

      </div>
    </section>
  </main>

  <footer class="site-footer admin-footer">
    <div class="container">
      <p class="site-footer__copy">&copy; 2026 Body Scent</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
